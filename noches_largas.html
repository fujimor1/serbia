<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERBIA — Noches Largas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Fragment+Mono:ital@0;1&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #cec8bf;
      background-image:
        radial-gradient(ellipse at 30% 60%, rgba(185, 178, 165, 0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(210, 205, 195, 0.7) 0%, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 40px 20px;
    }

    /* ── FLIP ── */
    .card {
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
    }

    .card.flip-out {
      transform: rotateY(90deg);
    }

    .card.flip-in {
      transform: rotateY(0deg);
    }

    /* ── CARD ÚNICO ── */
    .card {
      width: 230px;
      background: #121212;
      border-radius: 14px;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.42),
        0 6px 16px rgba(0, 0, 0, 0.28),
        0 0 0 0.5px rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    /* ════════════════
   VISTA A: PLAYER
════════════════ */
    #view-player {
      display: flex;
      flex-direction: column;
      padding: 14px 14px 10px;
    }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .cover-art {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 80% 70% at 25% 35%, #c0c0c0 0%, transparent 55%),
        radial-gradient(ellipse 90% 90% at 75% 70%, #383838 0%, transparent 65%),
        linear-gradient(150deg, #eee 0%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cover-art svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.13;
    }

    .cover-text {
      position: relative;
      z-index: 2;
      text-align: center;
      line-height: 1.2;
    }

    .ct-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-style: italic;
      font-weight: 300;
      font-size: 9px;
      color: rgba(90, 90, 90, 0.9);
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 4px;
    }

    .ct-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.18em;
      color: #111;
      display: block;
    }

    .ct-art {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px;
      letter-spacing: 0.22em;
      color: rgba(70, 70, 70, 0.8);
      display: block;
      margin-top: 3px;
    }

    .song-info {
      padding: 9px 2px 4px;
    }

    .song-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
    }

    .song-artist {
      font-size: 8.5px;
      color: #888;
      margin-top: 1px;
    }

    .sp-progress {
      padding: 6px 2px 2px;
    }

    .sp-times {
      display: flex;
      justify-content: space-between;
      font-size: 6.5px;
      color: #666;
      margin-bottom: 3px;
    }

    .sp-track {
      height: 2px;
      background: #333;
      border-radius: 1px;
      position: relative;
    }

    .sp-fill {
      height: 100%;
      width: 40%;
      background: #fff;
      border-radius: 1px;
    }

    .sp-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      left: calc(40% - 3px);
    }

    .sp-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 4px;
    }

    .sp-icon {
      color: #999;
      cursor: pointer;
      transition: color .15s;
      line-height: 0;
    }

    .sp-icon:hover {
      color: #fff;
    }

    .sp-play {
      width: 32px;
      height: 32px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .15s, background .15s;
      padding-left: 2px;
    }

    .sp-play:hover {
      transform: scale(1.08);
      background: #ddd;
    }

    .sp-footer {
      border-top: 1px solid #1f1f1f;
      padding: 8px 2px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 18px;
    }

    .sound-bars span {
      display: block;
      width: 2px;
      background: #fff;
      border-radius: 1px;
      opacity: 0.45;
      animation: bar-bounce var(--dur) ease-in-out infinite alternate;
    }

    .sound-bars span:nth-child(1) {
      --dur: 0.60s;
      height: 6px;
      animation-delay: 0.00s;
    }

    .sound-bars span:nth-child(2) {
      --dur: 0.40s;
      height: 14px;
      animation-delay: 0.10s;
    }

    .sound-bars span:nth-child(3) {
      --dur: 0.70s;
      height: 10px;
      animation-delay: 0.05s;
    }

    .sound-bars span:nth-child(4) {
      --dur: 0.50s;
      height: 18px;
      animation-delay: 0.15s;
    }

    .sound-bars span:nth-child(5) {
      --dur: 0.45s;
      height: 8px;
      animation-delay: 0.08s;
    }

    .sound-bars span:nth-child(6) {
      --dur: 0.65s;
      height: 16px;
      animation-delay: 0.20s;
    }

    .sound-bars span:nth-child(7) {
      --dur: 0.50s;
      height: 11px;
      animation-delay: 0.12s;
    }

    .sound-bars span:nth-child(8) {
      --dur: 0.60s;
      height: 14px;
      animation-delay: 0.03s;
    }

    .sound-bars span:nth-child(9) {
      --dur: 0.40s;
      height: 7px;
      animation-delay: 0.18s;
    }

    .sound-bars span:nth-child(10) {
      --dur: 0.70s;
      height: 12px;
      animation-delay: 0.07s;
    }

    .sound-bars span:nth-child(11) {
      --dur: 0.50s;
      height: 16px;
      animation-delay: 0.14s;
    }

    .sound-bars span:nth-child(12) {
      --dur: 0.60s;
      height: 9px;
      animation-delay: 0.09s;
    }

    .sound-bars span:nth-child(13) {
      --dur: 0.45s;
      height: 13px;
      animation-delay: 0.16s;
    }

    .sound-bars span:nth-child(14) {
      --dur: 0.65s;
      height: 18px;
      animation-delay: 0.04s;
    }

    .sound-bars span:nth-child(15) {
      --dur: 0.50s;
      height: 8px;
      animation-delay: 0.11s;
    }

    .sound-bars span:nth-child(16) {
      --dur: 0.60s;
      height: 15px;
      animation-delay: 0.19s;
    }

    .sound-bars span:nth-child(17) {
      --dur: 0.40s;
      height: 10px;
      animation-delay: 0.06s;
    }

    .sound-bars span:nth-child(18) {
      --dur: 0.70s;
      height: 14px;
      animation-delay: 0.13s;
    }

    .sound-bars span:nth-child(19) {
      --dur: 0.50s;
      height: 6px;
      animation-delay: 0.17s;
    }

    .sound-bars span:nth-child(20) {
      --dur: 0.55s;
      height: 12px;
      animation-delay: 0.02s;
    }

    @keyframes bar-bounce {
      from {
        transform: scaleY(0.3);
      }

      to {
        transform: scaleY(1);
      }
    }

    /* ════════════════
   VISTA B: LETRA
════════════════ */
    #view-lyric {
      display: none;
      flex-direction: column;
    }

    /* titlebar */
    .popup-titlebar {
      background: #1a1a1a;
      border-bottom: 1px solid #252525;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pt-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: #888;
      letter-spacing: 0.07em;
    }

    .pt-x {
      width: 13px;
      height: 13px;
      border: 1px solid #333;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
      font-size: 8px;
      line-height: 1;
      transition: all .15s;
      flex-shrink: 0;
    }

    .pt-x:hover {
      border-color: #fff;
      color: #fff;
    }

    /* contenido centrado */
    .lyric-content {
      padding: 20px 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* imagen grande centrada */
    .lyric-img {
      width: 130px;
      height: 130px;
      border-radius: 8px;
      background:
        radial-gradient(ellipse at 30% 30%, #c8c8c8 0%, transparent 55%),
        radial-gradient(ellipse at 70% 70%, #444 0%, transparent 55%),
        linear-gradient(135deg, #e0e0e0 0%, #1a1a1a 100%);
      border: 0.5px solid #2e2e2e;
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .lyric-img svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.2;
    }

    /* número de verso encima de la imagen */
    .verse-num {
      position: absolute;
      top: 8px;
      right: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.12em;
    }

    /* texto de la letra */
    .lyric-text {
      font-family: 'Fragment Mono', monospace;
      font-size: 11.5px;
      font-style: italic;
      font-weight: 300;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-line;
      text-align: center;
      min-height: 42px;
      width: 130px;
      margin-bottom: 16px;
    }

    /* botón mismo ancho que la imagen */
    .lyric-ok {
      width: 130px;
      padding: 10px 0;
      background: #2a2a2a;
      border: 1px solid #404040;
      border-radius: 7px;
      color: #ccc;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }

    .lyric-ok:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }

    .lyric-ok:active {
      background: #1e1e1e;
      transform: scale(0.97);
    }

    /* contador abajo */
    .lyric-footer {
      padding: 0 20px 16px;
      display: flex;
      justify-content: center;
    }

    .lyric-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      color: #2e2e2e;
      letter-spacing: 0.14em;
    }

    /* ════════════════
   VISTA C: FIN
════════════════ */
    #view-end {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 340px;
      padding: 28px 20px;
      text-align: center;
    }

    .end-line {
      width: 22px;
      height: 1px;
      background: #2e2e2e;
      margin: 0 auto 14px;
    }

    .end-t {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.18em;
      color: #ddd;
      margin-bottom: 4px;
    }

    .end-s {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px;
      letter-spacing: 0.18em;
      color: #3a3a3a;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .end-btns {
      display: flex;
      gap: 8px;
    }

    .end-btn {
      background: transparent;
      border: 1px solid #2e2e2e;
      color: #555;
      font-size: 8px;
      letter-spacing: 0.12em;
      padding: 7px 14px;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'IBM Plex Mono', monospace;
      border-radius: 4px;
      transition: all .15s;
    }

    .end-btn:hover {
      border-color: #888;
      color: #ddd;
    }

    .end-btn.p {
      border-color: #555;
      color: #aaa;
    }

    .end-btn.p:hover {
      background: #2a2a2a;
      color: #fff;
      border-color: #888;
    }
  </style>
</head>

  <script>
    const LYRICS = [
      "No puedo siempre estar así",
      "La almohada me comienza a quemar",
      "Prefiero nunca ser feliz",
      "Me mata dar mil vueltas de más",
      "Y cada vez que te veo",
      "Me vuelvo a tropezar",
      "Maldito bucle eterno",
      "Y no puedo siempre estar así, buscándote",
      "En estas noches largas, sin amor",
      "¿Cómo es que sobrevivimos una más",
      "De estas noches largas, azul dolor?",
      "¿Cómo es que sobrevivimos?",
      "No me vuelvas a hablar",
      "No me vuelvas a hablar en tu vida",
      "Sí, siempre la cago, pero intento remediarlo",
      "Y tú la cagas, pero no te veo intentando",
      "¿Que no te han dicho que nuestra canción ya fue?",
      "No quiero verte en mis sueños",
      "Ni en los tiktoks de mis compas que siguen en el armario",
      "Si vamos a terminar ni creas que me va a matar",
      "Yo atrapada aquí en mi cuarto y tú en un piso de algún bar",
      "Y qué pena me das, que nomás vas a contar",
      "La versión que te conviene y dónde siempre quedo mal",
      "Puras mentiras nomás",
      "Ni quien te quiera buscar",
      "En estas noches largas, sin amor",
      "¿Cómo es que sobrevivimos una más",
      "De estas noches largas, azul dolor?",
      "¿Cómo es que sobrevivimos?",
      "No me vuelvas a hablar",
      "No me vuelvas a hablar en tu vida",
      "Qué más da si mañana no despierto",
      "Si no hay nadie que me extrañe, que me llore el cielo",
      "Qué más da si mañana no despierto",
      "Qué más da, qué más da",
      "Qué más da si mañana no despierto",
      "Si ignoras mi canción te la canto en tus sueños",
      "Qué más da si mañana las cosas ya no están tan mal",
    ];

    const TOTAL = LYRICS.length;
    let current = 0;

    function pad(n) { return String(n).padStart(2, '0'); }

    function update(i) {
      document.getElementById('verse-num').textContent = '// ' + pad(i + 1);
      document.getElementById('lyric-text').textContent = LYRICS[i];
      document.getElementById('lyric-count').textContent = pad(i + 1) + ' / ' + pad(TOTAL);
    }

    const card = document.getElementById('card');

    function flipThen(callback) {
      card.classList.add('flip-out');
      setTimeout(() => {
        callback();
        card.classList.remove('flip-out');
        card.classList.add('flip-in');
        setTimeout(() => card.classList.remove('flip-in'), 420);
      }, 420);
    }

    function showPlayer() {
      flipThen(() => {
        document.getElementById('view-player').style.display = 'flex';
        document.getElementById('view-lyric').style.display = 'none';
        document.getElementById('view-end').style.display = 'none';
      });
    }
    function showLyric() {
      flipThen(() => {
        document.getElementById('song').play();
        document.getElementById('view-player').style.display = 'none';
        document.getElementById('view-lyric').style.display = 'flex';
        document.getElementById('view-end').style.display = 'none';
        update(current);
      });
    }
    function nextVerse() {
      current++;
      if (current >= TOTAL) {
        document.getElementById('view-lyric').style.display = 'none';
        document.getElementById('view-end').style.display = 'flex';
        return;
      }
      update(current);
    }
    function restart() {
      current = 0;
      update(0);
      document.getElementById('view-end').style.display = 'none';
      document.getElementById('view-lyric').style.display = 'flex';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const lv = document.getElementById('view-lyric');
        const pv = document.getElementById('view-player');
        if (lv.style.display !== 'none') nextVerse();
        else if (pv.style.display !== 'none') showLyric();
      }
      if (e.key === 'Escape') showPlayer();
    });
  </script>
